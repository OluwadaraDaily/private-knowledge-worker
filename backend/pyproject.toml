[project]
name = "private-knowledge-worker-backend"
version = "0.1.0"
description = "FastAPI backend for Private Knowledge Worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.116,<1.0",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "httpx2>=2.12,<3",
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "ruff>=0.16,<1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true

[tool.pytest]
minversion = "9.0"
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "T20", "UP"]

[tool.uv]
package = false
