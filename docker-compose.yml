services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-private_knowledge_worker}
      POSTGRES_USER: ${POSTGRES_USER:-pkw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pkw_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-private_knowledge_worker_test}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-pkw}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-pkw_password}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
